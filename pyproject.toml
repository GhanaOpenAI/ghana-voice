[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghana-voice-trainer"
version = "0.1.0"
description = "Finetuning toolkit for Neu-TTS Ghanaian and African voice models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "GhanaOpenAI"}
]
keywords = ["tts", "text-to-speech", "ghana", "africa", "vieneu-tts", "neu-tts", "voice-cloning"]
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "neucodec>=0.0.6",
    "africa-g2p>=0.3.0",
    "sherpa-onnx>=1.10.0",
    "jiwer>=3.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "huggingface_hub>=0.20.0"
]

[project.scripts]
ghana-voice-trainer = "ghana_voice_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghana_voice_trainer*"]
